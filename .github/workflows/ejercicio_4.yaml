#4. Artefactos de Construcción: Job 1 genera un archivo .txt con un mensaje. Job 2 debe descargar ese archivo y mostrar su contenido.

on: 
  workflow_dispatch:
env:
  FILE_NAME: "file.txt"

jobs:
  create_file:
    name: "Create a file with a message"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hola Mundo!" > ${{ env.FILE_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: my-file
  
  download_file:
    name: "Download the file and display its content"
    runs-on: ubuntu-latest
    needs: create_file
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-file
      - run: cat ${{ env.FILE_NAME }}